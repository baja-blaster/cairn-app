<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cairn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4;--surface:#F8F9FB;--raised:#FFFFFF;--ink:#17212E;--muted:#586475;--line:#D3DAE2;
  --accent:#3346D6;--accent-ink:#FFFFFF;--accent-soft:#E0E4FA;--ok:#1B8F6B;--danger:#BF4230;
  --k0:#3B4FD8;--k1:#D14D7A;--k2:#D18A1F;--k3:#1E9A78;--k4:#6B7A8F;
  --display:'Bricolage Grotesque','Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="day"]){
    --bg:#0E141C;--surface:#141C26;--raised:#1A2431;--ink:#E5EAF1;--muted:#93A0B1;--line:#26313F;
    --accent:#8190FF;--accent-ink:#0E141C;--accent-soft:#222B55;--ok:#45C79C;--danger:#F0806E;
    --k0:#8E9BFF;--k1:#F08AB0;--k2:#F0B75A;--k3:#5ED6AE;--k4:#A3B0C2;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141C;--surface:#141C26;--raised:#1A2431;--ink:#E5EAF1;--muted:#93A0B1;--line:#26313F;
  --accent:#8190FF;--accent-ink:#0E141C;--accent-soft:#222B55;--ok:#45C79C;--danger:#F0806E;
  --k0:#8E9BFF;--k1:#F08AB0;--k2:#F0B75A;--k3:#5ED6AE;--k4:#A3B0C2;
  color-scheme:dark;
}
:root[data-theme="day"]{
  --bg:#F3E7D0;--surface:#F8EEDB;--raised:#FCF6E9;--ink:#8C1117;--muted:#7C2B28;--line:#DCCBAB;
  --accent:#B81D17;--accent-ink:#FCF6E9;--accent-soft:#EBD5B6;--ok:#2C7A3F;--danger:#620A0F;
  --k0:#2F5F80;--k1:#8A3E6B;--k2:#B07A12;--k3:#4F7A3A;--k4:#7D6A58;
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}

/* shell */
.shell{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:22px 14px;border-right:1px solid var(--line)}
.brand{font:600 25px/1 var(--display);padding:2px 10px 22px}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:none;color:var(--muted);font-weight:600;border-radius:10px;cursor:pointer;text-align:left}
.nav-btn:hover{background:color-mix(in srgb,var(--line) 45%,transparent)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.syncchip{display:none;align-items:center;gap:7px;font:600 12px/1 inherit;font-family:inherit;color:var(--muted);background:var(--card,transparent);border:1px solid var(--line);border-radius:999px;padding:8px 11px;cursor:pointer}
.syncchip i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.syncchip.ok i{background:#2e9e5b}.syncchip.wait i,.syncchip.busy i{background:#d9a21b}.syncchip.bad i{background:var(--danger)}.syncchip.bad{color:var(--danger)}
@media(max-width:899px){.syncchip{display:inline-flex}}
.scanbox{position:relative;aspect-ratio:4/3;background:#111;border-radius:14px;overflow:hidden;margin-bottom:10px}.scanbox video{width:100%;height:100%;object-fit:cover}.scanbox .scanline{position:absolute;left:8%;right:8%;top:50%;height:2px;background:rgba(255,70,70,.9);box-shadow:0 0 8px rgba(255,70,70,.7)}
.csvlist{max-height:42vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:0 10px;margin:8px 0}
.csvrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.csvrow:last-child{border-bottom:0}
.csvrow .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.csvrow .a{font-variant-numeric:tabular-nums}.csvrow .sub2{grid-column:2/4;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}.csvrow select{max-width:150px;padding:4px 6px;font-size:13px}
.blk.ext{border-left-style:dashed;background-image:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--c) 7%,transparent) 7px 8px)}
.gc-row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dform label.gc-on{flex-direction:row;align-items:center;gap:9px;font-weight:600}
.gc-err{color:var(--danger,#b3261e);margin:4px 0 8px}
.status{margin-top:auto;font-size:12px;color:var(--muted);padding:6px 10px;line-height:1.35;background:none;border:0;text-align:left;cursor:pointer;border-radius:8px;font-family:inherit}
.status:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.content{padding:30px clamp(16px,3.2vw,44px) 70px;max-width:1280px;width:100%}
.tabbar{display:none}

/* common */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-title{font:600 clamp(30px,4.2vw,42px)/1.05 var(--display);letter-spacing:-.025em}
.sub{color:var(--muted);margin-top:8px;max-width:60ch}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--raised);cursor:pointer}
.btn:hover{border-color:color-mix(in srgb,var(--muted) 60%,var(--line))}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px}
.icon-btn{width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{background:color-mix(in srgb,var(--line) 55%,transparent);color:var(--ink)}
.mini{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer}
.mini i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.mini.run i{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.sec-title{font-size:15px;font-weight:700;display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-title small{font-weight:500;color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:14px 0;max-width:46ch}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--line) 55%,transparent);border-radius:999px;padding:3px;gap:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(10,20,40,.12)}

/* day */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px;max-width:620px}
.wd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;border:1px solid transparent;background:none;border-radius:12px;cursor:pointer;color:var(--muted)}
.wd:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.wd-n{font-size:12px;font-weight:600}
.wd-d{font-size:18px;font-weight:700;color:var(--ink)}
.wd-dots{display:flex;gap:3px;height:6px;margin-top:2px}
.wd-dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.55}
.wd.today .wd-d{color:var(--accent)}
.wd.sel{background:var(--accent);border-color:var(--accent)}
.wd.sel .wd-n,.wd.sel .wd-d{color:var(--accent-ink)}
.wd.sel .wd-dots i{background:var(--accent-ink)}
.panes{display:none;margin-bottom:16px}
.day-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:44px;align-items:start}
.side{display:flex;flex-direction:column;gap:30px}

.tl{position:relative;margin-left:54px;border-left:1px solid var(--line);cursor:cell}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hr.half{border-top:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.hr span{position:absolute;left:-56px;top:-9px;width:46px;text-align:right;font-size:12px;color:var(--muted)}
.blk{position:absolute;border-radius:7px;padding:4px 9px;background:color-mix(in srgb,var(--c) 15%,var(--surface));border-left:3px solid var(--c);overflow:hidden;cursor:pointer;font-size:13px;line-height:1.3;color:var(--ink);cursor:pointer}
.blk:hover{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.blk .b-title{font-weight:600;display:flex;align-items:center;gap:7px}
.blk .b-time{color:var(--muted);font-size:12px}
.blk.done .b-title span{text-decoration:line-through;opacity:.65}
.now{position:absolute;left:-5px;right:0;height:2px;background:var(--accent);pointer-events:none;z-index:3}
.now::before{content:"";position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl-empty{position:absolute;left:18px;right:18px;top:40px;color:var(--muted);pointer-events:none}

/* checkbox */
.chk{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--muted);background:none;display:inline-grid;place-items:center;cursor:pointer;flex:none;padding:0;color:transparent;transition:background .12s,border-color .12s}
.chk:hover{border-color:var(--ok)}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.sm{width:16px;height:16px}

.tagbar{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 22px}
.tg{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:none;font-size:13px;font-weight:600;cursor:pointer}
.tg:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.tg small{color:var(--muted);font-weight:500;font-size:12.5px}
.tg[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}

/* tasks */
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick input{flex:1;min-width:0}
.group-h{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 4px}
.group-h.late{color:var(--danger)}
.task{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.task .t-main{flex:1;min-width:0;cursor:pointer}
.t-title{display:block;font-weight:500;overflow-wrap:anywhere}
.task.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-meta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12.5px;color:var(--muted)}
.t-meta .late{color:var(--danger);font-weight:600}
.t-meta .imp{color:var(--k2);font-weight:600}

/* habits (day side) */
.hrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.hrow .h-name{flex:1;min-width:0}
.hrow small{color:var(--muted)}

/* summary */
.brief{max-width:64ch}
.brief p{font-size:17.5px;line-height:1.7;margin:0 0 20px;overflow-wrap:anywhere}
.brief .lead{font:600 clamp(23px,2.9vw,30px)/1.32 var(--display);margin-bottom:26px}
.brief .nudge{border-left:3px solid var(--danger);padding-left:14px}
.nudge-actions{margin:-8px 0 22px;padding-left:17px}
.evtag{background:color-mix(in srgb,var(--c) 17%,transparent);border-bottom:2px solid var(--c);padding:0 4px;border-radius:3px;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.brief .nudge3{border-left:3px solid var(--k2);padding-left:14px}
.nextup{border:1.5px solid var(--accent);border-radius:14px;padding:14px 18px;margin:0 0 26px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
.nextup p{margin:0 0 10px!important}
.nu-l{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px}
.brief .nudge2{border-left:3px solid var(--accent);padding-left:14px}
.brief .soon{color:var(--muted);border-left:3px solid var(--line);padding-left:14px;font-size:16px}

/* quit */
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:52px;align-items:start}
.lead2{font:600 clamp(22px,2.8vw,28px)/1.3 var(--display);margin-bottom:14px;max-width:34ch}
.qintro{max-width:60ch}
.qintro p{line-height:1.65;font-size:16.5px;margin-bottom:12px}
.qclock{display:flex;flex-wrap:wrap;gap:4px 30px;align-items:baseline;margin:4px 0 8px}
.qclock span{color:var(--muted);font-weight:600}
.qclock b{font:600 clamp(48px,9vw,76px)/1 var(--display);color:var(--ink);margin-right:8px}
.qrow{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.qrow b{font-variant-numeric:tabular-nums}
.ms{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ms:not(.done){opacity:.62}
.ms .chk{margin-top:2px;cursor:default}
.reason{border-left:3px solid var(--accent);padding:2px 0 2px 14px;margin:10px 0;font:500 18px/1.4 var(--display);overflow-wrap:anywhere}
.note{border-left:3px solid var(--line);padding-left:14px;color:var(--muted);font-size:14.5px;line-height:1.55}
.btn.lg{padding:13px 24px;font-size:16px}
.pacer{width:112px;height:112px;border-radius:50%;margin:4px auto;background:color-mix(in srgb,var(--accent) 22%,transparent);border:2px solid var(--accent);animation:breathe 10s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.55)}40%{transform:scale(1)}}
.crclock{font:600 44px/1 var(--display);text-align:center}
.breath{text-align:center;color:var(--muted);margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-weight:400}

.allday{display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap;padding:9px 12px;margin:0 0 10px 54px;border-radius:9px;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:3px solid var(--c)}
.allday span{color:var(--muted);font-size:13.5px}
.blk{touch-action:pan-y;cursor:grab}
.rz{position:absolute;left:0;right:0;height:9px;cursor:ns-resize;touch-action:none;z-index:2}
.rz-top{top:0}.rz-bot{bottom:0}
.rz-bot::after{content:"";position:absolute;left:50%;bottom:2px;width:24px;height:3px;border-radius:2px;background:var(--c);opacity:.5;transform:translateX(-50%)}
.blk.tiny .rz{height:5px}
@media (pointer:coarse){.rz{height:14px}.blk.tiny .rz{height:9px}}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.dragtip{position:fixed;z-index:60;background:var(--ink);color:var(--bg);padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:600;pointer-events:none;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:8px}
.chip.ad{background:color-mix(in srgb,var(--c) 22%,var(--surface));font-weight:600}

.late-t{color:var(--danger);font-weight:600}
.bar.over i{background:var(--danger)}
.goalline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.55;pointer-events:none}
.tx{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.tx[role="button"],.tx [role="button"]{cursor:pointer}
.tx .amt{font-weight:700;font-variant-numeric:tabular-nums}
.tx .amt.in{color:var(--ok)}
.bq{display:grid;grid-template-columns:110px 1fr;gap:8px;margin-bottom:22px}
.bq input[name="note"]{grid-column:1/-1}
.bq .btn{grid-column:1/-1;justify-content:center}
.person{padding:16px 0;border-bottom:1px solid var(--line)}
.rank{font-size:13px;color:var(--muted);margin-top:2px}
.pips{display:flex;gap:4px;margin-top:10px}
.pips i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--accent)}
.planned{border:1.5px dashed var(--line);border-radius:14px;padding:18px 20px;max-width:60ch}
.planned b{display:block;margin-bottom:6px}
.planned p{color:var(--muted);line-height:1.6}

.meetq{border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:0 0 22px}
.meetrow{margin:8px 0 12px}
.meetrow p{margin:0 0 8px!important}

.jgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px;align-items:start}
.note{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.note:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.note.on{background:var(--accent-soft)}
.note b{overflow-wrap:anywhere}
.jarea{display:block;width:100%;min-height:320px;line-height:1.65;font-size:16.5px;resize:vertical}
.jtitle{width:100%;font:600 24px/1.2 var(--display)!important;margin-bottom:10px}
.moods{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mood{padding:7px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--raised);font-weight:600;cursor:pointer}
.mood[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.jback{display:none}
.rv-day{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}

.planrow{flex-direction:row!important;align-items:baseline!important;gap:12px!important;padding:8px 0;border-bottom:1px solid var(--line);font-weight:400!important}
.pl-t{min-width:15ch;color:var(--muted);font-variant-numeric:tabular-nums}
.wkscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.wk{display:grid;grid-template-columns:54px repeat(7,minmax(104px,1fr));min-width:820px}
.wk-h{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line);background:none;cursor:pointer;color:var(--muted);font-weight:600}
.wk-h:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.wk-h b{font-size:20px;color:var(--ink)}
.wk-h small{font-weight:500;font-size:11.5px}
.wk-h.today b{color:var(--accent)}
.wk-adc{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;min-height:6px}
.wk-ad{font-size:11.5px;padding:2px 6px;border-radius:5px;background:color-mix(in srgb,var(--c) 20%,var(--surface));border-left:2px solid var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-gutter{position:relative}
.wk-gutter span{position:absolute;right:8px;transform:translateY(-8px);font-size:12px;color:var(--muted)}
.wk-col{border-left:1px solid var(--line)}
.wk-col.today{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.wk .tl{margin-left:0;border-left:0}
.wk .tl .hr span{display:none}
.wk .blk{padding:3px 5px;font-size:12px}
.wk .blk .b-time{display:none}

.blk[data-multi] .rz{display:none}
.blk[data-multi]{cursor:pointer}

.folders{margin-bottom:16px;display:flex;flex-direction:column}
.fold{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:8px 12px;border:0;border-radius:10px;background:none;text-align:left;cursor:pointer;font-weight:600;color:var(--muted)}
.fold:hover{background:color-mix(in srgb,var(--line) 40%,transparent)}
.fold.on{background:var(--accent-soft);color:var(--accent)}
.fold small{font-weight:500}
.jfold{margin-bottom:10px;max-width:260px}

}

  const rel = isToday ? 'Today. ' : d === addDays(today,1) ? 'Tomorrow. ' : d === addDays(today,-1) ? 'Yesterday. ' : '';
  const sub = rel + (open ? open+(open===1?' task':' tasks')+' open, ' : 'No open tasks, ') + (planned ? fmtDur(planned)+' scheduled, ' : 'nothing scheduled, ') + fmtDur(Math.round(free/10)*10)+' free.';

      (hsAll.length ? hsAll.map(h => { const s = streak(h); return '<div class="hrow"><button class="chk" data-act="toggle-habit" data-id="'+h.id+'" data-date="'+d+'" aria-pressed="'+(!!h.log[d])+'" aria-label="Mark '+esc(h.name)+' done"'+(d>today?' disabled':'')+'>'+ic('check',14)+'</button><div class="h-name">'+esc(h.name)+'</div>'+(h.target ? '<small>'+habitWeekCount(h,exWeekStart(d))+' of '+h.target+' this week</small>' : (s>1?'<small>'+s+'-day streak</small>':''))+'</div>'; }).join('')

function viewTasks(){
  const f = ui.taskFilter, today = todayStr();
  let list = state.tasks.slice();
  if(ui.goalFilter) list = list.filter(t => t.goalId === ui.goalFilter);
  const gf = ui.goalFilter ? goalById(ui.goalFilter) : null;
  let body = '';
  if(f === 'recurring'){
    const rec = list.filter(t => !t.done && t.repeat).sort((a,b) => (a.due||'').localeCompare(b.due||''));
    body = ['daily','weekdays','weekly','biweekly','monthly','yearly'].map(r => { const g = rec.filter(t => t.repeat === r); return g.length ? '<div class="group-h">'+(REPEATS.find(x => x[0] === r)[1])+'</div>'+g.map(t => taskRow(t,true)).join('') : ''; }).join('')
      || '<p class="empty">No repeating tasks yet. Add one with a phrase like "water plants every sun" or "pay rent monthly" in the quick add, or set Repeat in the task dialog.</p>';
  } else if(f === 'done'){
    const done = list.filter(t => t.done).sort((a,b) => (b.doneAt||0)-(a.doneAt||0));
    body = done.length ? '<div class="group-h">Completed</div>'+done.map(t => taskRow(t,true)).join('') : '<p class="empty">Nothing completed yet.</p>';
  } else {
    const pool = list.filter(t => f === 'all' ? true : !t.done);
    const grp = (label, arr, cls) => arr.length ? '<div class="group-h '+(cls||'')+'">'+label+'</div>'+sortTasks(arr).map(t => taskRow(t,true)).join('') : '';
    const od = pool.filter(t => !t.done && t.due && t.due < today);
    const td = pool.filter(t => t.due === today);
    const up = pool.filter(t => t.due && t.due > today).sort((a,b) => a.due.localeCompare(b.due));
    const nd = pool.filter(t => !t.due);
    body = grp('Overdue', od, 'late') + grp('Today', td) + (up.length ? '<div class="group-h">Upcoming</div>'+up.map(t => taskRow(t,true)).join('') : '') + grp('No date', nd);
    if(f === 'all'){ const dn = pool.filter(t => t.done && t.due && t.due < today); body += grp('Earlier, completed', dn); }
    if(!body) body = '<p class="empty">'+(state.tasks.length ? 'All clear.' : 'No tasks yet. Add your first one above. You can type a time estimate, a day, or "!" for important.')+'</p>';
  }
  return '<div class="head"><div><h1 class="page-title">Tasks</h1><p class="sub">'+(gf?'Showing tasks for the project "'+esc(gf.title)+'".':'Your to-do list and focus timer in one place. Press play on any task to start a session on it.')+'</p></div>'+topActions('<button class="btn primary" data-act="new-task">'+ic('plus',18)+'Task</button>')+'</div>'+
    '<div class="panes seg" role="group" aria-label="Section">'+[['tasks','Tasks'],['focus','Focus'],['goals','Projects']].map(p => '<button data-act="task-pane" data-pane="'+p[0]+'" aria-pressed="'+(ui.taskPane===p[0])+'">'+p[1]+'</button>').join('')+'</div>'+
    '<div class="twrap" data-pane="'+ui.taskPane+'"><section class="tmain"><div class="seg" role="group" aria-label="Filter" style="margin-bottom:14px">'+[['open','Open'],['recurring','Repeating'],['done','Done'],['all','All']].map(x => '<button data-act="filter-tasks" data-value="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>').join('')+'</div>'+
      quickForm(null,'Add a task, try "Pay rent fri" or "Read 30m"')+body+'</section>'+
    '<aside class="tside"><section class="focus-sec">'+focusPanelHTML()+'</section><section class="goals-sec">'+goalsHTML()+'</section><section class="log-sec">'+focusLogHTML()+'</section></aside></div>';
}

const joinList = a => a.length <= 1 ? (a[0] || '') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];
function budgetWatch(){
  const b = state.budget; if(!b) return null;
  const mk = todayStr().slice(0,7), st = bMonth(b,mk), over = [], warn = [];
  b.cats.forEach(c => { const lim = Number(c.limit)||0; if(!lim) return; const sp = st.by[c.name]||0; if(sp >= lim) over.push({ c:c, sp:sp, lim:lim }); else if(sp/lim >= 0.8) warn.push({ c:c, sp:sp, lim:lim }); });
  if(!over.length && !warn.length) return null;
  const p = mk.split('-').map(Number), dim = new Date(p[0],p[1],0).getDate(), left = dim-new Date().getDate();
  const parts = over.map(x => esc(x.c.name)+(x.sp > x.lim ? ' is over its '+bMoney(b,x.lim)+' limit by '+bMoney(b,x.sp-x.lim)+'.' : ' has reached its '+bMoney(b,x.lim)+' limit.'))
    .concat(warn.map(x => esc(x.c.name)+' is at '+Math.round(x.sp/x.lim*100)+'% of its '+bMoney(b,x.lim)+' limit'+(left > 0 ? ' with '+left+(left===1?' day':' days')+' left in the month.' : ' on the last day of the month.')));
  return { text:'Budget watch: '+parts.join(' '), severe:over.length > 0 };
}
function missedBlocks(){
  const now = Date.now(), cut = addDays(todayStr(),-7);
  return state.events.filter(e => e.taskId && !e.repeat && e.date >= cut && evEndMs(e) < now).filter(e => {
    const t = taskById(e.taskId); if(!t || t.done) return false;
    return !(t.repeat && state.tasks.some(x => x.fromRepeat === t.id && x.doneAt && ymd(new Date(x.doneAt)) === e.date));
  }).sort((a,b) => (a.date+a.start) < (b.date+b.start) ? -1 : 1);
}
function firstFreeSlot(dur){
  const t0 = todayStr();
  for(let i=0;i<14;i++){ const d = addDays(t0,i), g = freeGapsFor(d).find(x => x.e-x.s >= dur); if(g) return { date:d, s:g.s, e:g.s+dur }; }
  return null;
}
function reschedBlock(ev){
  const dur = Math.max(15, toMin(ev.end)-toMin(ev.start)), slot = firstFreeSlot(dur); if(!slot) return false;
  ev.date = slot.date; ev.start = fromMin(slot.s); ev.end = fromMin(slot.e); delete ev.endDate; return true;

const qMoney = (q,v) => (q.cur || '$') + (v >= 100 ? Math.round(v).toLocaleString() : v.toFixed(2));
const qLast = q => q.slips.length ? Math.max.apply(null, q.slips.map(x => x.t)) : q.start;
function sinceText(ms){
  const m = Math.max(0, Math.floor(ms/6e4)), d = Math.floor(m/1440), h = Math.floor(m%1440/60), mi = m%60;
  if(d >= 1) return d+(d===1?' day':' days')+(h ? ' and '+h+(h===1?' hour':' hours') : '');
  if(h >= 1) return h+(h===1?' hour':' hours')+(mi ? ' and '+mi+(mi===1?' minute':' minutes') : '');

function qStats(q){
  const now = Date.now(), days = (now-q.start)/864e5;

/* ---------- food: pantry, groceries, meals, calories ---------- */
const SLOTS = ['Breakfast','Lunch','Dinner','Snack'];
const GROC_CATS = ['Produce','Dairy and eggs','Meat and fish','Pantry','Frozen','Bakery','Drinks','Other'];
const FOOD_UNITS = ['g','kg','oz','lb','lbs','ml','l','cup','cups','tbsp','tsp','can','cans','pkg','bag','bags','bunch','clove','cloves','slice','slices','dozen','jar','bottle','box','pack'];
const fmtN = n => Number(n || 0).toLocaleString();
const round2 = n => Math.round(n*100)/100;
const singular = w => w.replace(/ies$/,'y').replace(/oes$/,'o').replace(/(ch|sh|x|ss)es$/,'$1').replace(/([^s])s$/,'$1');
const nkey = n => String(n||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim().split(' ').map(singular).join(' ');
const CAT_WORDS = [
  ['Frozen', /\b(frozen|ice cream)/], ['Dairy and eggs', /\b(milk|cheese|yogurt|yoghurt|butter|egg|cream|kefir)/],
  ['Meat and fish', /\b(chicken|beef|pork|fish|salmon|tuna|shrimp|turkey|bacon|sausage|steak|ham|lamb|tofu)/],
  ['Produce', /\b(apple|banana|lettuce|spinach|tomato|onion|garlic|carrot|pepper|potato|broccoli|lemon|lime|avocado|cucumber|berry|berries|grape|orange|fruit|veg|salad|celery|mushroom|zucchini|kale|herb|basil|cilantro|parsley|ginger)/],
  ['Bakery', /\b(bread|bagel|tortilla|bun|roll|pita|wrap)/], ['Drinks', /\b(juice|soda|coffee|tea|water|beer|wine|kombucha)/],
  ['Pantry', /\b(rice|pasta|flour|sugar|oil|bean|lentil|sauce|cereal|oat|salt|spice|stock|broth|nut|honey|vinegar|noodle|can)/]
];
function guessCat(name){ const n = String(name||'').toLowerCase(); for(let i=0;i<CAT_WORDS.length;i++) if(CAT_WORDS[i][1].test(n)) return CAT_WORDS[i][0]; return 'Other'; }
function parseQtyName(line){
  let t = String(line||'').trim(), qty = 1, unit = '';
  let m = t.match(/^(\d+\/\d+|\d+(?:\.\d+)?)\s*(.*)$/);
  if(m){
    qty = m[1].indexOf('/') >= 0 ? Number(m[1].split('/')[0])/Number(m[1].split('/')[1]) : Number(m[1]); t = m[2];
    const w = t.split(/\s+/); if(w.length > 1 && FOOD_UNITS.indexOf(w[0].toLowerCase()) >= 0){ unit = w[0].toLowerCase(); t = w.slice(1).join(' '); }
  } else { m = t.match(/^(.*?)\s+(\d+(?:\.\d+)?)$/); if(m){ t = m[1]; qty = Number(m[2]); } }
  t = t.replace(/^of\s+/i,'').trim();
  return { name:t || String(line||'').trim(), qty:round2(qty), unit:unit };
}
const fmtIng = i => (Number(i.qty) === 1 && !i.unit ? '' : round2(i.qty)+(i.unit ? ' '+i.unit : '')+' ')+i.name+(i.kcal !== undefined && i.kcal !== null ? ' ('+Math.round(i.kcal)+' kcal)' : '');
const slotNow = () => { const h = new Date().getHours(); return h < 10 ? 'Breakfast' : h < 15 ? 'Lunch' : h < 20 ? 'Dinner' : 'Snack'; };
const slotIdx = x => Math.max(0, SLOTS.indexOf(x));
const foodDay = d => state.food.log.filter(x => x.date === d);
const kcalOn = d => { const l = foodDay(d); return l.length ? l.reduce((a,x) => a+(Number(x.kcal)||0), 0) : (state.food.totals[d] || 0); };
function parseFoodLine(raw){ const m = String(raw||'').trim().match(/^(.*?)[\s:]+(\d{1,4})\s*(?:k?cal(?:ories)?)?$/i); return m && m[1].trim() ? { name:m[1].trim(), kcal:Number(m[2]) } : null; }
function recentFoods(){
  const seen = {}, out = [];
  state.food.log.slice().sort((a,b) => (b.t||0)-(a.t||0)).forEach(x => { const k = nkey(x.name)+'|'+x.kcal; if(!seen[k] && out.length < 8){ seen[k] = 1; out.push(x); } });
  return out;
}
const recipeById = id => state.food.recipes.find(r => r.id === id);
const mealKcal = m => Math.round((Number(m.kcal)||0)*(Number(m.servings)||1));
function mealIngredients(m){
  const r = m.recipeId ? recipeById(m.recipeId) : null; if(!r) return [];
  const mult = (Number(m.servings)||1)/(Number(r.servings)||1);
  return r.ingredients.map(i => ({ name:i.name, qty:round2((Number(i.qty)||1)*mult), unit:i.unit||'' }));
}
const pantryMatch = ing => state.food.pantry.find(p => nkey(p.name) === nkey(ing.name) && (!ing.unit || !p.unit || p.unit === ing.unit));
const missingFor = m => mealIngredients(m).filter(i => { const p = pantryMatch(i); return !p || (Number(p.qty)||0) < i.qty-0.0001; });
function groceryNeeds(from, to){
  const need = {};
  state.food.plan.filter(m => m.date >= from && m.date <= to).forEach(m => mealIngredients(m).forEach(i => {
    const k = nkey(i.name)+'|'+(i.unit||''); (need[k] = need[k] || { name:i.name, qty:0, unit:i.unit||'' }).qty += i.qty;
  }));
  return Object.keys(need).map(k => need[k]).map(n => { const p = pantryMatch(n); return Object.assign({}, n, { qty:round2(n.qty-(p ? (Number(p.qty)||0) : 0)) }); }).filter(n => n.qty > 0.0001);
}
function addGrocery(it, from){
  const g = state.food.grocery, ex = g.find(x => !x.checked && nkey(x.name) === nkey(it.name) && (x.unit||'') === (it.unit||''));
  if(ex){ ex.qty = round2((Number(ex.qty)||0)+(Number(it.qty)||1)); return ex; }
  const n = { id:uid(), name:it.name, qty:round2(Number(it.qty)||1), unit:it.unit||'', cat:it.cat || guessCat(it.name), checked:false, from:from||'' }; g.push(n); return n;
}
function addPantry(it){
  const p = state.food.pantry, ex = p.find(x => nkey(x.name) === nkey(it.name) && (x.unit||'') === (it.unit||''));
  if(ex){ ex.qty = round2((Number(ex.qty)||0)+(Number(it.qty)||1)); if(it.expires) ex.expires = it.expires; return ex; }
  const n = { id:uid(), name:it.name, qty:round2(Number(it.qty)||1), unit:it.unit||'', cat:it.cat || guessCat(it.name), expires:it.expires||'', min:Number(it.min)||0 }; p.push(n); return n;
}
const pantryDays = p => p.expires ? dayDiff(todayStr(), p.expires) : null;
const lowPantry = () => state.food.pantry.filter(p => Number(p.min) > 0 && (Number(p.qty)||0) <= Number(p.min));
const usesUpSoon = () => state.food.pantry.filter(p => p.expires && pantryDays(p) <= 4).sort((a,b) => a.expires.localeCompare(b.expires));
function expLabel(p){

  return d < 0 ? 'Past its date' : d === 0 ? 'Expires today' : d === 1 ? 'Expires tomorrow' : d <= 7 ? 'Expires in '+d+' days' : 'Best by '+shortD(p.expires);
}
/* ingredient calories */
const U_FAM = { g:['w',1], kg:['w',1000], oz:['w',28.3495], lb:['w',453.592], lbs:['w',453.592], ml:['v',1], l:['v',1000], tsp:['v',4.92892], tbsp:['v',14.7868], cup:['v',236.588], cups:['v',236.588] };
function unitInfo(u){
  u = String(u||'').toLowerCase().trim();
  if(U_FAM[u]) return { fam:U_FAM[u][0], f:U_FAM[u][1] };
  if(u === 'dozen') return { fam:'c:', f:12 };
  if(!u) return { fam:'c:', f:1 };
  return { fam:'c:'+singular(u), f:1 };
}
function convertQty(qty, from, to){ const a = unitInfo(from), b = unitInfo(to); return a.fam === b.fam ? qty*a.f/b.f : null; }
const libFind = (name, unit) => state.food.cals.filter(c => nkey(c.name) === nkey(name)).find(c => unitInfo(c.unit).fam === unitInfo(unit).fam) || null;
function ingKcal(i){
  if(i.kcal !== undefined && i.kcal !== null && i.kcal !== '') return Number(i.kcal);
  const c = libFind(i.name, i.unit); if(!c) return null;
  const q = convertQty(Number(i.qty)||1, i.unit, c.unit); if(q === null) return null;
  return Number(c.kcal)*q/(Number(c.qty)||1);
}
function recipeCalc(r){
  let tot = 0; const missing = [];
  r.ingredients.forEach(i => { const k = ingKcal(i); if(k === null) missing.push(i.name); else tot += k; });
  return { total:Math.round(tot), per:Math.round(tot/Math.max(1, Number(r.servings)||1)), missing:missing };
}
function learnCal(i){
  const ex = libFind(i.name, i.unit);
  if(ex){ ex.qty = i.qty; ex.unit = i.unit; ex.kcal = i.kcal; return ex; }
  const n = { id:uid(), name:i.name, qty:i.qty, unit:i.unit, kcal:i.kcal }; state.food.cals.push(n); return n;
}
function parseIngredientLine(line){
  let t = String(line||'').trim(), kcal = null;
  const m = t.match(/\s*(?:\(|=)\s*(\d+(?:\.\d+)?)\s*(?:kcal|cal|calories)\s*\)?\s*$/i);
  if(m){ kcal = Number(m[1]); t = t.slice(0, m.index).trim(); }
  const p = parseQtyName(t); if(kcal !== null) p.kcal = kcal; return p;
}

/* weight */
const KG2LB = 2.20462;
const wUnit = () => state.food.weightUnit || 'lb';
const kgToU = kg => wUnit() === 'lb' ? kg*KG2LB : kg;
const uToKg = v => wUnit() === 'lb' ? v/KG2LB : v;

  const vals = pts.map(p => kgToU(p.kg)), lo = Math.min(...vals), hi = Math.max(...vals), pad2 = Math.max(0.5, (hi-lo)*0.15), y0 = lo-pad2, y1 = hi+pad2;
  const X = p => 14+(fromYmd(p.date).getTime()-t0)/span*292, Y = v => 112-(v-y0)/(y1-y0)*100;
  const avg = pts.map(p => { const win = pts.filter(q => q.date <= p.date && q.date >= addDays(p.date,-6)); return { x:X(p), v:kgToU(win.reduce((a,q) => a+q.kg, 0)/win.length) }; });

function cookable(){

  return state.food.recipes.filter(r => r.ingredients.length).map(r => {
    const miss = [], uses = [];
    r.ingredients.forEach(i => {
      const p = pantryMatch(i), need = Number(i.qty)||1, got = p ? (Number(p.qty)||0) : 0;
      if(!p || got < need-0.0001) miss.push({ name:i.name, qty:round2(need-got), unit:i.unit||'' });
      if(p && got > 0 && soon.indexOf(nkey(p.name)) >= 0) uses.push(p);

    const total = r.ingredients.length, have = total-miss.length;
    return { r:r, have:have, total:total, miss:miss, uses:uses, score:have/total*100+uses.length*15 };
  }).sort((a,b) => (a.miss.length ? 1 : 0)-(b.miss.length ? 1 : 0) || b.score-a.score || a.r.name.localeCompare(b.r.name));
}

/* import a recipe from pasted text */
const UFRAC = { '\u00bd':'1/2', '\u00bc':'1/4', '\u00be':'3/4', '\u2153':'1/3', '\u2154':'2/3', '\u215b':'1/8', '\u215c':'3/8', '\u215d':'5/8', '\u215e':'7/8', '\u2155':'1/5' };
function normFractions(line){
  let t = String(line).replace(/[\u00bd\u00bc\u00be\u2153\u2154\u215b\u215c\u215d\u215e\u2155]/g, c => ' '+UFRAC[c]+' ').replace(/\s+/g,' ').trim();
  t = t.replace(/^(\d+(?:\.\d+)?)\s*(?:-|\u2013|to)\s*(\d+(?:\.\d+)?)\b/, (m,a,b) => b);
  t = t.replace(/^(\d+)\s+(\d+)\/(\d+)\b/, (m,a,b,c) => String(round2(Number(a)+Number(b)/Number(c))));
  t = t.replace(/^(\d+)\/(\d+)\b/, (m,a,b) => String(round2(Number(a)/Number(b))));
  return t;
}
function parseRecipeText(raw){
  const lines = String(raw||'').replace(/\r/g,'').split('\n').map(l => l.trim());
  const isIng = l => /^(ingredients?)\b[:\s]*$/i.test(l), isSteps = l => /^(instructions?|directions?|method|steps?|preparation)\b[:\s]*$/i.test(l);
  const iI = lines.findIndex(isIng), sI = lines.findIndex(isSteps);
  const first = lines.find(l => l && !isIng(l) && !isSteps(l)), name = first && first.length <= 90 && !/^\d/.test(first) ? first.replace(/^#+\s*/,'') : '';
  const sm = raw.match(/(?:serves|servings?|makes|yield)[:\s]*(\d+)/i) || raw.match(/(\d+)\s*servings?/i);
  const cm = raw.match(/calories?[:\s]*(\d{2,4})/i) || raw.match(/(\d{2,4})\s*(?:kcal|calories)\s*(?:per|\/)\s*serving/i);
  let ingLines;
  if(iI >= 0) ingLines = lines.slice(iI+1, sI > iI ? sI : lines.length).filter(Boolean);
  else ingLines = lines.filter(l => /^[\s\u2022\-*\u25a2\u25a1\u2610\u25e6\u25aa\u25cf]*(\d|[\u00bd\u00bc\u00be\u2153\u2154\u215b])/.test(l) && l.length < 120 && !/^\d+[.)]\s/.test(l));
  const ingredients = [];
  ingLines.slice(0,60).forEach(l => {
    let t = l.replace(/^[\s\u2022\-*\u25a2\u25a1\u2610\u25e6\u25aa\u25cf]+/, '').replace(/^\d+[.)]\s+/, '');
    if(!t || (/:\s*$/.test(t) && !/\d/.test(t))) return;
    t = t.replace(/\((?!\s*\d+(?:\.\d+)?\s*(?:kcal|cal|calories))[^)]*\)/gi, ' ');
    const p = parseIngredientLine(normFractions(t));
    let nm = p.name.split(',')[0].replace(/\b(to taste|for serving|for garnish|divided|optional)\b.*$/i,'').replace(/\s+/g,' ').trim();
    if(!nm) return; p.name = nm; ingredients.push(p);
  });
  const steps = sI >= 0 ? lines.slice(sI+1).filter(Boolean).join('\n') : '';
  return { name:name, servings:sm ? Number(sm[1]) : 2, kcal:cm ? Number(cm[1]) : '', ingredients:ingredients, steps:steps };
}

function shopReminder(){
  const F = state.food; if(!(F.shopDays || []).length) return null;
  const t = todayStr(), n = groceryOpen().length;
  const needs = groceryNeeds(t, addDays(t,6)).filter(x => !F.grocery.some(g => !g.checked && nkey(g.name) === nkey(x.name)));

let pendingCsv = null;
function parseCsv(text){

  const first = text.split(/\r?\n/).find(l => l.trim()) || '', counts = { ',':0, ';':0, '\t':0 }; let inq = false;
  for(const ch of first){ if(ch === '"') inq = !inq; else if(!inq && counts[ch] !== undefined) counts[ch]++; }
  let delim = ','; Object.keys(counts).forEach(k => { if(counts[k] > counts[delim]) delim = k; });
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += ch; }
    else if(ch === '"') q = true;
    else if(ch === delim){ row.push(cell); cell = ''; }
    else if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i+1] === '\n') i++; row.push(cell); cell = ''; if(row.some(c => c.trim() !== '')) rows.push(row); row = []; }

}

  if((m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(t))){ let y = +m[3]; if(y < 100) y += 2000; return order === 'dmy' ? ymdChecked(y, +m[2], +m[1]) : ymdChecked(y, +m[1], +m[2]); }

  const data = hasHeader ? rows.slice(1) : rows, cols = Math.max.apply(null, rows.slice(0, 50).map(r => r.length).concat([1]));
  if(hasHeader){

/* ---------- focus timer ---------- */
const T = { mode:'focus', running:false, endAt:0, left:0, total:0, taskId:null };
let tickId = null;
const modeLen = () => (T.mode === 'focus' ? state.settings.focusLen : state.settings.breakLen);
function resetTimerValues(){ T.total = modeLen()*60; T.left = T.total; }
function persistTimer(){ try { localStorage.setItem(LS_TIMER, JSON.stringify(T)); } catch(e){} }
const timerSecs = () => (T.running ? Math.max(0, Math.round((T.endAt-Date.now())/1000)) : T.left);
function restoreTimer(){
  resetTimerValues();
  try {
    const raw = localStorage.getItem(LS_TIMER);
    if(raw){ const o = JSON.parse(raw); if(o && o.total){ Object.assign(T, o); } }
  } catch(e){}
  if(T.running){ if(T.endAt <= Date.now()){ completeTimer(); } else { startTick(); } }
}
function startTick(){ clearInterval(tickId); tickId = setInterval(tick, 500); }
function tick(){ if(timerSecs() <= 0){ completeTimer(); } updateTimerDOM(); }
function updateTimerDOM(){
  const s = timerSecs(), txt = fmtClock(s);
  document.querySelectorAll('[data-timer-text]').forEach(n => { n.textContent = txt; });
  const arc = $('#ringArc'); if(arc){ const C = 2*Math.PI*110; arc.style.strokeDashoffset = String(C*(1-(T.total?s/T.total:0))); }
  const active = T.running || (T.total - s > 0 && T.total - s < T.total);
  document.querySelectorAll('.mini').forEach(n => { n.hidden = !active || (ui.view === 'tasks' && (ui.taskPane === 'focus' || (window.matchMedia && window.matchMedia('(min-width:900px)').matches))); n.classList.toggle('run', T.running); });
  document.title = T.running ? txt+' '+(T.mode==='focus'?'Focus':'Break')+' - Cairn' : 'Cairn';
}
function beep(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext; const c = new AC();
    const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = 660;
    g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(0.2, c.currentTime+0.03); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+0.9);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.95);
  } catch(e){}
}
function logFocus(mins){
  if(mins < 1) return false;
  state.focus.push({ id:uid(), date:todayStr(), min:Math.round(mins), taskId:T.taskId||null, t:Date.now() });
  save(); return true;
}
function completeTimer(){
  clearInterval(tickId); T.running = false;
  beep();
  if(T.mode === 'focus'){ logFocus(T.total/60); toast('Focus session complete. '+fmtDur(T.total/60)+' logged.'); T.mode = 'break'; }
  else { toast('Break over. Ready for the next focus session.'); T.mode = 'focus'; }
  resetTimerValues(); persistTimer();
  if(ui.view === 'tasks') render(); else updateTimerDOM();
}
function startTimer(){
  if(T.running) return;
  if(T.left <= 0) resetTimerValues();
  T.endAt = Date.now()+T.left*1000; T.running = true; persistTimer(); startTick(); render();
}
function pauseTimer(){ T.left = timerSecs(); T.running = false; clearInterval(tickId); persistTimer(); render(); }
function resetTimer(){ T.running = false; clearInterval(tickId); resetTimerValues(); persistTimer(); render(); }
function finishTimer(){
  const elapsed = (T.total - timerSecs())/60;
  T.running = false; clearInterval(tickId);
  if(T.mode === 'focus' && logFocus(elapsed)) toast(fmtDur(elapsed)+' logged.');
  resetTimerValues(); persistTimer(); render();
}

    '<label class="dform" style="padding:0;font-weight:600;font-size:13.5px;gap:5px"><span>Working on</span><select id="focusTask"><option value="">Nothing in particular</option>'+openTasks.map(t => '<option value="'+t.id+'"'+(T.taskId===t.id?' selected':'')+'>'+esc(t.title)+'</option>').join('')+'</select></label>'+
    '<div class="ctrls">'+(T.running?'<button class="btn primary" data-act="timer-pause">Pause</button>':'<button class="btn primary" data-act="timer-start">'+(started?'Resume':'Start')+'</button>')+

function gtinOk(c){
  if(!/^\d+$/.test(c) || [8,12,13,14].indexOf(c.length) < 0) return false;

/* ---------- parsing quick-add ---------- */
function parseQuick(raw, base){
  let t = ' '+raw.trim(), due = base || null, est = null, imp = false, repeat = '', everyDow = null, dated = false;
  const rp = (re, val) => { if(!repeat && re.test(t)){ repeat = val; t = t.replace(re, ' '); } };
  rp(/\s+(?:every\s+weekdays?|weekdays)\b/i, 'weekdays');
  rp(/\s+(?:every\s+(?:2|two|other)\s+weeks?|biweekly|fortnightly)\b/i, 'biweekly');
  rp(/\s+(?:every\s+week|weekly)\b/i, 'weekly');
  rp(/\s+(?:every\s+month|monthly)\b/i, 'monthly');
  rp(/\s+(?:every\s+year|yearly|annually)\b/i, 'yearly');
  rp(/\s+(?:every\s+day|daily)\b/i, 'daily');
  if(!repeat){ const m = t.match(/\s+every\s+(sun|mon|tue|wed|thu|fri|sat)[a-z]*\b/i); if(m){ repeat = 'weekly'; everyDow = ['sun','mon','tue','wed','thu','fri','sat'].indexOf(m[1].toLowerCase()); t = t.replace(m[0], ' '); } }
  t = t.replace(/\s+!+\s*$/, () => { imp = true; return ''; });
  t = t.replace(/\s+(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hours?)\b/i, (m,n) => { est = Math.round(parseFloat(n)*60); return ''; });
  t = t.replace(/\s+(\d+)\s*(?:m|min|mins|minutes?)\b/i, (m,n) => { est = parseInt(n,10); return ''; });
  t = t.replace(/\s+(today|tomorrow|tmrw|tmr|someday)\s*$/i, (m,w) => { w = w.toLowerCase(); dated = true; due = w==='today' ? todayStr() : w==='someday' ? null : addDays(todayStr(),1); return ''; });
  t = t.replace(/\s+(?:on\s+)?(sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:rs|rsday)?|fri(?:day)?|sat(?:urday)?)\s*$/i, (m,w) => {
    const idx = ['sun','mon','tue','wed','thu','fri','sat'].indexOf(w.slice(0,3).toLowerCase());
    const diff = ((idx - new Date().getDay() + 7) % 7) || 7; dated = true; due = addDays(todayStr(), diff); return '';
  });
  if(everyDow !== null && !dated) due = addDays(todayStr(), (everyDow - new Date().getDay() + 7) % 7);
  if(repeat && !due) due = todayStr();
  t = t.trim(); if(!t) t = raw.trim();
  return { title:t, due:due, est:est, imp:imp, repeat:repeat };
}

    if(parent && (!parent.due || parent.due > t.due)){ parent.due = t.due; state.tasks = state.tasks.filter(x => x.id !== t.id); save(); render(); toast('Moved back to '+dueLabel(parent.due)+'.'); return; }

function nextFreeStart(d){

    const rec = { date:String(fd.get('date')||todayStr()), slot:String(fd.get('slot')||'Dinner'), name:name, recipeId:recipeId, servings:Math.max(0.25, Number(fd.get('servings'))||1), kcal:kcal };
    if(id){ const m = state.food.plan.find(x => x.id === id); if(m) Object.assign(m, rec); } else state.food.plan.push(Object.assign({ id:uid(), logged:false }, rec));
    ui.foodWeek = rec.date; save('food'); closeDialog(); render(); return;
  }
  if(kind === 'recipe'){
    const name = String(fd.get('name')||'').trim(); if(!name) return;
    const ingredients = String(fd.get('ingredients')||'').split('\n').map(l => l.trim()).filter(Boolean).slice(0,60).map(parseIngredientLine);
    ingredients.forEach(i => { if(i.kcal !== undefined) learnCal(i); });
    const rec = { name:name, servings:Math.max(1, Number(fd.get('servings'))||1), kcal:Math.max(0, Number(fd.get('kcal'))||0), ingredients:ingredients, notes:String(fd.get('notes')||'').trim(), steps:String(fd.get('steps')||'').trim().slice(0,4000), auto:fd.get('auto') === 'on' };
    let msg = '';
    if(rec.auto && ingredients.length){
      const rc = recipeCalc(rec);
      if(rc.missing.length) msg = 'Calories were not worked out. Missing: '+rc.missing.slice(0,3).join(', ')+(rc.missing.length > 3 ? ' and more' : '')+'. Add them like "2 cups rice (400 kcal)" and save again.';
      else { rec.kcal = rc.per; msg = 'Calories per serving set to '+fmtN(rec.kcal)+' from the ingredients.'; }
    }
    if(id){ const r = recipeById(id); if(r) Object.assign(r, rec); } else state.food.recipes.push(Object.assign({ id:uid() }, rec));
    save('food'); closeDialog(); render(); if(msg) toast(msg); return;
  }
  if(kind === 'cal'){
    const name = String(fd.get('name')||'').trim(); if(!name) return;
    const rec = { name:name, qty:Math.max(0.01, Number(fd.get('qty'))||1), unit:String(fd.get('unit')||'').trim().toLowerCase(), kcal:Math.max(0, Number(fd.get('kcal'))||0) };
    if(id){ const c = state.food.cals.find(x => x.id === id); if(c) Object.assign(c, rec); } else { const ex = libFind(rec.name, rec.unit); if(ex) Object.assign(ex, rec); else state.food.cals.push(Object.assign({ id:uid() }, rec)); }
    save('food'); closeDialog(); render(); return;
  }
  if(kind === 'pantry'){
    const name = String(fd.get('name')||'').trim(); if(!name) return;
    const rec = { name:name, qty:Math.max(0, Number(fd.get('qty'))||0), unit:String(fd.get('unit')||'').trim().toLowerCase(), cat:String(fd.get('cat')||'Other'), expires:String(fd.get('expires')||''), min:Number(fd.get('min'))||0 };
    const bc = normCode(fd.get('barcode')); if(bc) rec.barcode = bc;
    if(id){ const p = state.food.pantry.find(x => x.id === id); if(p){ Object.assign(p, rec); if(!String(fd.get('barcode')||'').trim()) delete p.barcode; } } else state.food.pantry.push(Object.assign({ id:uid() }, rec));
    ui.foodTab = 'pantry'; save('food'); closeDialog(); render(); return;
  }
  if(kind === 'scancode'){
    const c = normCode(fd.get('code')); if(!c){ openScanDialog('That does not look like a valid barcode. Check the digits and try again.', true); return; }
    scanStop(); handleCode(c); return;
  }
  if(kind === 'scanresult'){
    const code = id, name = String(fd.get('name')||'').trim(); if(!name) return;
    const q = Number(fd.get('qty')) > 0 ? Number(fd.get('qty')) : 1, unit = String(fd.get('unit')||'').trim().toLowerCase(), cat = String(fd.get('cat')||'Other'), expires = String(fd.get('expires')||'');
    snapshot(); let p = state.food.pantry.find(x => x.barcode === code);
    if(p){ p.qty = round2((Number(p.qty)||0)+q); if(expires) p.expires = expires; p.name = name; if(unit) p.unit = unit; p.cat = cat; }
    else { p = addPantry({ name:name, qty:q, unit:unit, cat:cat, expires:expires }); p.barcode = code; }
    if(fd.get('remember')) upsertProduct(code, { name:name, cat:cat, unit:unit });
    ui.foodTab = 'pantry'; save('food'); closeDialog(); render(); toast('Added '+round2(q)+' '+name+' to the pantry.', true);
    scan.ignore = { code:code, until:Date.now()+4000 };   /* the item is probably still in front of the camera */
    if(ui.scanCam) setTimeout(() => openScanDialog(), 350);
    return;
  }
  if(kind === 'quick-pantry'){
    const raw = String(fd.get('text')||'').trim(); if(!raw) return; const p = parseQtyName(raw);
    addPantry({ name:p.name, qty:p.qty, unit:p.unit, cat:guessCat(p.name) }); save('food'); render();
    const q = document.querySelector('[data-form="quick-pantry"] input'); if(q && !('ontouchstart' in window)) q.focus(); return;
  }
  if(kind === 'quick-groc'){
    const raw = String(fd.get('text')||'').trim(); if(!raw) return; const p = parseQtyName(raw);
    addGrocery({ name:p.name, qty:p.qty, unit:p.unit }, ''); save('food'); render();
    const q = document.querySelector('[data-form="quick-groc"] input'); if(q && !('ontouchstart' in window)) q.focus(); return;
  }
  if(kind === 'grocitem'){
    const g = state.food.grocery.find(x => x.id === id); if(!g) return; const name = String(fd.get('name')||'').trim(); if(!name) return;
    Object.assign(g, { name:name, qty:Math.max(0, Number(fd.get('qty'))||0), unit:String(fd.get('unit')||'').trim().toLowerCase(), cat:String(fd.get('cat')||'Other') });
    save('food'); closeDialog(); render(); return;
  }
  if(kind === 'folder'){
    const name = String(fd.get('name')||'').trim().slice(0,40); if(!name) return;
    if(id && jr.items[id]){ jr.items[id].name = name; jrTouch(id); }
    else { const fid = 'f-'+uid(); jr.items[fid] = { id:fid, kind:'folder', name:name, c:Date.now(), u:0 }; jrTouch(fid); ui.noteFolder = fid; }
    closeDialog(); render(); return;
  }
  if(kind === 'plan'){
    const p = planCache; if(!p) return; const idx = fd.getAll('p').map(Number); let n = 0;
    snapshot();
    idx.forEach(i => { const x = p.placed[i]; if(!x) return; state.events.push({ id:uid(), title:x.t.title, date:p.date, start:fromMin(x.s), end:fromMin(x.e), color:0, taskId:x.t.id, repeat:'', personId:'' }); n++; });
    if(!n){ closeDialog(); return; }
    ui.date = p.date; save(); closeDialog(); render(); toast('Added '+n+(n===1?' block':' blocks')+' to your schedule. Drag them to adjust.', true); return;
  }
  if(kind === 'quick-event'){
    const raw = String(fd.get('text')||'').trim(); if(!raw) return;
    addQuickEvent(raw);
    const q = document.querySelector('[data-form="quick-event"] input'); if(q && !('ontouchstart' in window)) q.focus();
    return;
  }
  if(kind === 'capture'){
    let raw = String(fd.get('text')||'').trim(); if(!raw) return;
    const type = String(fd.get('kind')||'task'); raw = raw.replace(CAP_PREFIX, '').trim(); if(!raw) return;
    closeDialog();
    if(type === 'event'){ addQuickEvent(raw); return; }
    if(type === 'note'){ const title = addQuickNote(raw); render(); toast('Note saved: '+(title || 'Untitled')+'.'); return; }
    const p = parseQuick(raw, null);
    state.tasks.push({ id:uid(), title:p.title, done:false, due:p.due, imp:p.imp, est:p.est, goalId:'', created:Date.now(), repeat:p.repeat, anchor:p.repeat && p.due ? Number(p.due.slice(8,10)) : undefined });
    save(); render(); toast('Task added: '+p.title+(p.due ? ', '+dueLabel(p.due) : '')+'.'); return;
  }
  if(kind === 'event'){
    let title = String(fd.get('title')||'').trim(); const taskId = String(fd.get('taskId')||'');
    if(!title && taskId){ const t = taskById(taskId); if(t) title = t.title; }
    const start = String(fd.get('start')), end = String(fd.get('end')), date = String(fd.get('date'));
    if(!title) return err('Add a title or link a task.');
    if(!date || !start || !end) return err('Choose a date, start and end time.');
    const endDate = String(fd.get('endDate')||'') || date;
    if(endDate < date) return err('The end date cannot be before the start date.');
    if(endDate === date && toMin(end) <= toMin(start)) return err('End time must be after the start time.');
    const rec = { title:title, date:date, endDate:endDate > date ? endDate : '', start:start, end:end, color:(fd.get('tag') === null || fd.get('tag') === '') ? -1 : Number(fd.get('tag')), taskId:taskId, repeat:String(fd.get('repeat')||''), personId:String(fd.get('personId')||''), quiet:fd.get('quiet') === 'on' };
    if(id){ const ev = state.events.find(x => x.id === id); if(ev){ if((ev.personId||'') !== rec.personId) delete ev.met; Object.assign(ev, rec); } }
    else state.events.push(Object.assign({ id:uid() }, rec));
    if(id === '' ) ui.date = date;
    save(); closeDialog(); render(); if(!id && ui.view !== 'day') toast('Added to your calendar.'); return;
  }
  if(kind === 'task'){
    const title = String(fd.get('title')||'').trim(); if(!title) return;
    const rec = { title:title, due:String(fd.get('due')||'')||null, est:Number(fd.get('est'))||null, goalId:String(fd.get('goalId')||''), imp:fd.get('imp') === 'on', repeat:String(fd.get('repeat')||'') };
    if(rec.repeat && !rec.due) rec.due = todayStr();
    rec.anchor = rec.repeat && rec.due ? Number(rec.due.slice(8,10)) : undefined;
    { const prev = (id && taskById(id)) ? (taskById(id).steps || []) : [], lines = String(fd.get('steps')||'').split('\n').map(l => l.trim()).filter(Boolean).slice(0,30);
      rec.steps = lines.map(l => prev.find(o => o.title.toLowerCase() === l.toLowerCase()) || { id:uid(), title:l.slice(0,120), done:false }); }
    if(id){ const t = taskById(id); if(t) Object.assign(t, rec); }
    else state.tasks.push(Object.assign({ id:uid(), done:false, created:Date.now() }, rec));
    save(); closeDialog(); render(); return;
  }
  if(kind === 'habit'){
    const name = String(fd.get('name')||'').trim(); const weekly = fd.get('mode') === 'week'; let days = fd.getAll('day').map(Number);
    if(!name) return err('Give the habit a name.');
    if(!weekly && !days.length) return err('Choose at least one day.');
    const target = weekly ? Math.max(1, Math.min(7, Number(fd.get('target'))||3)) : 0;
    if(weekly) days = [0,1,2,3,4,5,6];
    if(id){ const h = state.habits.find(x => x.id === id); if(h){ h.name = name; h.days = days; h.target = target; } }
    else state.habits.push({ id:uid(), name:name, days:days, target:target, log:{}, created:todayStr() });
    save(); closeDialog(); render(); return;
  }
  if(kind === 'goal'){
    const title = String(fd.get('title')||'').trim(); if(!title) return;
    const rec = { title:title, about:String(fd.get('about')||'').trim().slice(0,200), target:String(fd.get('target')||'')||null, status:['active','paused','done'].indexOf(String(fd.get('status'))) >= 0 ? String(fd.get('status')) : 'active' };
    if(id){ const g = goalById(id); if(g) Object.assign(g, rec); save(); closeDialog(); render(); return; }
    const ng = Object.assign({ id:uid(), created:Date.now() }, rec); state.goals.push(ng); ui.projectId = ng.id; ui.view = 'project';
    save(); closeDialog(); render(); window.scrollTo(0,0); return;
  }
  if(kind === 'quitplan'){
    const rec = { baseline:Math.max(1,Number(fd.get('baseline'))||10), pack:Math.max(0,Number(fd.get('pack'))||0), packSize:Math.max(1,Number(fd.get('packSize'))||20),
      cur:String(fd.get('cur')||'$').slice(0,3), reasons:String(fd.get('reasons')||'').split('\n').map(x => x.trim()).filter(Boolean).slice(0,6), triggers:fd.getAll('trigger').map(String) };
    if(!state.quit) state.quit = Object.assign({ start:null, slips:[], cravings:[], prep:{}, quitDate:String(fd.get('quitDate')||todayStr()) }, rec);
    else { Object.assign(state.quit, rec); if(!state.quit.start && fd.get('quitDate')) state.quit.quitDate = String(fd.get('quitDate')); }
    ui.habitTab = 'quit'; save(); closeDialog(); render(); return;
  }
  if(kind === 'slip'){
    const q = state.quit; if(!q) return; snapshot();
    const n = Math.max(1, Math.min(60, Number(fd.get('n'))||1)), now = Date.now();
    q.slips.push({ t:now, n:n });
    q.cravings.push({ id:uid(), t:now, level:Number(fd.get('level'))||null, trigger:String(fd.get('trigger')||''), result:'smoked' });
    save(); closeDialog(); render(); toast('Logged. Your clock restarted. You have done this before, so keep going.', true); return;
  }
  if(kind === 'workout'){
    const rec = { date:String(fd.get('date')||todayStr()), type:String(fd.get('type')||'Other'), min:Math.max(1,Math.min(600,Number(fd.get('min'))||30)), level:String(fd.get('level')||''), note:String(fd.get('note')||'').trim() };
    if(id){ const w = state.exercise.log.find(x => x.id === id); if(w) Object.assign(w, rec); }
    else state.exercise.log.push(Object.assign({ id:uid(), t:Date.now() }, rec));
    ui.habitTab = 'exercise'; save(); closeDialog(); render();
    if(!id){ const wk = exWeek(exWeekStart(todayStr())); toast('Workout logged. '+wk.n+' of '+state.exercise.goal.sessions+' this week.'); }
    return;
  }
  if(kind === 'exgoal'){
    state.exercise.goal = { sessions:Math.max(1,Math.min(14,Number(fd.get('sessions'))||3)), minutes:Math.max(30,Math.min(1500,Number(fd.get('minutes'))||150)) };
    save(); closeDialog(); render(); return;
  }
  if(kind === 'person'){
    const name = String(fd.get('name')||'').trim(); if(!name) return;
    const rec = { name:name, kind:String(fd.get('kind')||'Friend'), freq:Number(fd.get('freq'))||14, last:String(fd.get('last')||'') || null, note:String(fd.get('note')||'').trim() };
    { const bm = Number(fd.get('bdM')) || 0, bd = Number(fd.get('bdD')) || 0, maxD = [31,29,31,30,31,30,31,31,30,31,30,31][bm-1] || 31; rec.bday = bm && bd ? pad(bm)+'-'+pad(Math.min(bd, maxD)) : ''; }
    if(id){ const p = state.people.find(x => x.id === id); if(p) Object.assign(p, rec); }
    else state.people.push(Object.assign({ id:uid(), points:0, history:[], created:todayStr() }, rec));
    ui.habitTab = 'social'; save(); closeDialog(); render(); return;
  }
  if(kind === 'reach'){
    const p = state.people.find(x => x.id === id); if(!p) return;
    const msg = logReach(p, String(fd.get('how')||'message'), String(fd.get('date')||todayStr()), fd.get('note'));
    save(); closeDialog(); render(); toast(msg); return;
  }
  if(kind === 'review'){
    const nws = addDays(exWeekStart(todayStr()),7), refl = String(fd.get('reflection')||'').trim();
    const pri = ['p1','p2','p3'].map(k => String(fd.get(k)||'').trim()).filter(Boolean);
    pri.forEach(title => state.tasks.push({ id:uid(), title:title, done:false, due:nws, imp:true, est:null, goalId:'', created:Date.now() }));
    if(refl){ const nid = 'n-'+uid(); jr.items[nid] = { id:nid, kind:'note', title:'Weekly review, '+loc(fromYmd(todayStr()),{month:'short',day:'numeric'}), body:refl, pin:0, c:Date.now(), u:0 }; jrTouch(nid); }
    state.lastReview = todayStr(); save(); ui.view = 'summary'; render();
    toast('Review saved.'+(pri.length ? ' '+pri.length+(pri.length===1?' priority':' priorities')+' added to next week.' : '')); return;
  }
  if(kind === 'sgoal'){
    const b = state.budget; if(!b) return; const name = String(fd.get('name')||'').trim(), target = Math.round(Number(fd.get('target'))*100)/100; if(!name || !(target > 0)) return;
    const rec = { name:name, target:target, saved:Math.max(0, Math.round((Number(fd.get('saved')) || 0)*100)/100), date:String(fd.get('date')||'') }; b.goals = b.goals || [];
    if(id){ const g = b.goals.find(x => x.id === id); if(g) Object.assign(g, rec); } else b.goals.push(Object.assign({ id:uid() }, rec));
    save('budget'); closeDialog(); render(); return;
  }
  if(kind === 'sgoal-money'){
    const b = state.budget, g = b && (b.goals || []).find(x => x.id === id); if(!g) return; const a = Math.round(Number(fd.get('amount'))*100)/100; if(!a) return;
    snapshot(); g.saved = Math.max(0, Math.round((Number(g.saved)+a)*100)/100); save('budget'); closeDialog(); render();
    toast(Number(g.saved) >= Number(g.target) ? 'Goal reached: '+g.name+'.' : (a > 0 ? 'Added '+bMoney(b, a)+' to '+g.name+'.' : 'Took '+bMoney(b, -a)+' out of '+g.name+'.'), true); return;
  }
  if(kind === 'csvimport'){
    const b = state.budget, p = pendingCsv; if(!b || !p) return; const idx = fd.getAll('inc').map(Number), items = p.items.slice(0, 300); if(!idx.length){ toast('Nothing ticked, so nothing was added.'); return; }
    snapshot(); let n = 0, newest = '';
    idx.forEach(i => { const it = items[i]; if(!it || it.old) return; const cat = String(fd.get('cat-'+i) || it.cat || 'Other'); b.tx.push({ id:uid(), date:it.date, amount:it.amount, cat:it.kind === 'income' ? 'Income' : cat, note:it.note, kind:it.kind, t:Date.now()+n }); n++; if(it.date > newest) newest = it.date; });
    pendingCsv = null; if(newest) ui.budgetMonth = newest.slice(0, 7); save('budget'); closeDialog(); render(); toast('Imported '+n+(n === 1 ? ' transaction.' : ' transactions.'), true); return;
  }
  if(kind === 'quick-tx'){
    const b = state.budget; if(!b) return;
    const amount = Math.round(Number(fd.get('amount'))*100)/100; if(!(amount > 0)) return;
    const cat = String(fd.get('cat')||'Other'), inc = cat === 'Income';
    b.tx.push({ id:uid(), date:form.dataset.date || todayStr(), amount:amount, cat:cat, note:String(fd.get('note')||'').trim(), kind:inc?'income':'expense', t:Date.now() });
    save('budget'); render();
    const q = document.querySelector('[data-form="quick-tx"] input'); if(q && !('ontouchstart' in window)) q.focus();
    return;
  }
  if(kind === 'tx'){
    const b = state.budget; if(!b) return; const t = b.tx.find(x => x.id === id); if(!t) return;
    const cat = String(fd.get('cat')||'Other');
    Object.assign(t, { amount:Math.round(Number(fd.get('amount'))*100)/100 || t.amount, cat:cat, kind:cat === 'Income' ? 'income' : 'expense', date:String(fd.get('date')||t.date), note:String(fd.get('note')||'').trim() });
    save('budget'); closeDialog(); render(); return;
  }
  if(kind === 'bill'){
    const b = state.budget; if(!b) return;
    const name = String(fd.get('name')||'').trim(); if(!name) return;
    const rec = { name:name, amount:Math.round(Number(fd.get('amount'))*100)/100 || 0, day:Math.max(1,Math.min(31,Number(fd.get('day'))||1)), cat:String(fd.get('cat')||'') };
    if(id){ const bl = b.bills.find(x => x.id === id); if(bl) Object.assign(bl, rec); } else b.bills.push(Object.assign({ id:uid() }, rec));
    save('budget'); closeDialog(); render(); return;
  }
  if(kind === 'budget'){
    const cats = [], seen = {};
    String(fd.get('cats')||'').split('\n').map(l => l.trim()).filter(Boolean).slice(0,24).forEach(l => {
      const i = l.lastIndexOf(':'); let name = l, limit = 0;
      if(i > 0){ name = l.slice(0,i).trim(); limit = parseFloat(l.slice(i+1).replace(/[^0-9.]/g,'')) || 0; }
      if(name && !seen[name.toLowerCase()]){ seen[name.toLowerCase()] = 1; cats.push({ name:name.slice(0,40), limit:limit }); }
    });
    const rec = { cur:String(fd.get('cur')||'$').slice(0,3), income:Number(fd.get('income'))||0, cats:cats };
    if(!state.budget) state.budget = Object.assign({ bills:[], tx:[], u:0 }, rec); else Object.assign(state.budget, rec);
    save('budget'); closeDialog(); render(); return;
  }
  if(kind === 'settings'){
    const s = state.settings;
    let a = Number(fd.get('dayStart')), b = Number(fd.get('dayEnd')); if(b <= a) b = Math.min(24, a+1);
    Object.assign(s, { dayStart:a, dayEnd:b, weekStart:Number(fd.get('weekStart')), reviewDay:Number(fd.get('reviewDay')), hideWords:String(fd.get('hideWords')||'').slice(0,200), theme:String(fd.get('theme')),
      focusLen:Math.max(5,Number(fd.get('focusLen'))||25), breakLen:Math.max(1,Number(fd.get('breakLen'))||5), dailyFocus:Math.max(15,Number(fd.get('dailyFocus'))||120) });
    if(!T.running && T.total - timerSecs() <= 0) resetTimerValues();
    save(); closeDialog(); render(); return;
  }
});

document.addEventListener('visibilitychange', () => {
  if(!document.hidden){ updateNow(); updateTimerDOM(); gcAuto(); engine.adapters.forEach(a => { if(a.pollNow && Date.now()-(a.lastPoll || 0) > 10000) a.pollNow(); }); }   /* freshen up when the app comes back to the front */
  else { if(engine.dirty) enginePush(); engine.adapters.forEach(a => { if(a.flushPending) a.flushPending(); }); }   /* save what is waiting before the phone puts the app to sleep */
});
setInterval(() => { if(applyDecay()) save(); updateNow(); gcAuto(); refreshStatus(); if((ui.view === 'summary' || (ui.view === 'habits' && ui.habitTab === 'quit')) && !dlg.open && !document.hidden) render(); }, 60000);

/* ---------- boot ---------- */
indexState();
try { if(!localStorage.getItem('daybook:first')) localStorage.setItem('daybook:first', String(Date.now())); } catch(e){}
if(applyDecay()) save();
restoreTimer();
render();
refreshStatus();
initSync();
setTimeout(gcAuto, 1500);
})();
</script>
